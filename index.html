<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday ni Baby mo po</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" id="questionCard">
    <h1>Will you go on a date with me baby ? ❤️</h1>
    <p>I would love to spend some quality time with you on my birthday!</p>

    <div class="photo-space">
      <img src="photo_2026-10-17_19-53-31.jpg" alt="A photo of us together">
    </div>

    <div class="buttons">
      <button id="yesBtn">YES! 🥰</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <div class="card hidden" id="successCard">
    <h1>YEHEY! I LOVE YOU ❤️🎉</h1>
    <p>Thank you for saying yes! I can't wait to celebrate my birthday with you! Take a screenshot and send to me Baby! 🥰</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
